stages:
  get_data:
    cmd: python get_data.py
    deps:
      - get_data.py
    outs:
      - data/data_raw.csv

  preprocess:
    cmd: python preprocess.py
    deps:
      - preprocess.py
      - data/data_raw.csv
    outs:
      - data/train.csv
      - data/test.csv

  train:
    cmd: python train.py
    deps:
      - train.py
      - data/train.csv
    outs:
      - models/model.pkl

  validate:
    cmd: python validate.py
    deps:
      - validate.py
      - models/model.pkl
      - data/test.csv
    metrics:
      - metrics.json:
          cache: false
    plots:
      - confusion_matrix.png:
          cache: false
